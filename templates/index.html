<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ollama Chat — {{ model }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e10;
      --surface: #18181b;
      --border: #2a2a2f;
      --accent: #7c6dfa;
      --accent-dim: #3d3577;
      --text: #e4e4e7;
      --muted: #71717a;
      --user-bg: #1e1b3a;
      --bot-bg: #18181b;
      --danger: #f87171;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    header h1 { font-family: var(--font-head); font-size: 15px; }

    header .model-tag {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot  { align-self: flex-start; }

    .label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }

    .bubble {
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.user .bubble { background: var(--user-bg); border: 1px solid var(--accent-dim); }
    .msg.bot .bubble  { background: var(--bot-bg); border: 1px solid var(--border); }

    .sources { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .sources:empty { display: none; }

    .thinking { color: var(--muted); font-style: italic; }
    .thinking-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
    }

    .error-bubble {
      background: #2a1010;
      border: 1px solid #7f2020;
      color: var(--danger);
      padding: 10px;
      border-radius: 8px;
      align-self: stretch;
    }

    /* ── Documents bar ── */
    #docs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 20px 0;
    }
    #docs-bar:empty { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 6px 4px 10px;
      border-radius: 999px;
      background: var(--user-bg);
      border: 1px solid var(--accent-dim);
      cursor: pointer;
      user-select: none;
      max-width: 280px;
    }
    .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .meta { color: var(--muted); }
    .chip.inactive { background: transparent; border-color: var(--border); color: var(--muted); }
    .chip.inactive .name { text-decoration: line-through; }
    .chip.uploading { cursor: default; opacity: .7; }
    .chip .remove {
      background: none; border: none; color: var(--muted);
      padding: 0 4px; font-size: 13px; line-height: 1;
    }
    .chip .remove:hover { color: var(--danger); }

    footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font: inherit;
      padding: 10px;
      border-radius: 6px;
      resize: none;
      height: 42px;
      max-height: 160px;
      line-height: 1.5;
    }
    textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

    button {
      font: inherit;
      height: 42px;
      padding: 0 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #send-btn { background: var(--accent); color: white; border: none; min-width: 84px; }
    #send-btn.stop { background: #7f2020; }

    #clear-btn, #attach-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    #attach-btn { padding: 0 12px; font-size: 16px; }
    #attach-btn:hover, #clear-btn:hover { color: var(--text); border-color: var(--muted); }

    .empty-state { margin: auto; text-align: center; color: var(--muted); line-height: 1.8; }

    /* ── Drag & drop overlay ── */
    #drop-overlay {
      position: fixed; inset: 0;
      background: rgba(124, 109, 250, .12);
      border: 2px dashed var(--accent);
      display: none;
      align-items: center; justify-content: center;
      font-family: var(--font-head); font-size: 18px;
      pointer-events: none;
      z-index: 10;
    }
    body.dragging #drop-overlay { display: flex; }
  </style>
</head>

<body>

<header>
  <div class="dot"></div>
  <h1>Ollama Chat</h1>
  <span class="model-tag">{{ model }}</span>
</header>

<div id="chat-box">
  <div class="empty-state" id="empty">
    <p>Start chatting with <code>{{ model }}</code></p>
    <p>or attach a PDF, TXT or MD file (📎 or drag &amp; drop) to ask questions about it.</p>
  </div>
</div>

<div id="docs-bar"></div>

<footer>
  <input type="file" id="file-input" accept=".pdf,.txt,.md" multiple hidden />
  <button id="attach-btn" title="Attach documents">📎</button>
  <textarea id="user-input" rows="1" placeholder="Type a message... (Shift+Enter for a new line)"></textarea>
  <button id="clear-btn" title="Clear the conversation (documents stay attached)">Clear</button>
  <button id="send-btn">Send ↑</button>
</footer>

<div id="drop-overlay">Drop files to attach</div>

<script>
const MODEL = {{ model|tojson }};
const MAX_UPLOAD_MB = {{ max_upload_mb|tojson }};
const ALLOWED = ['.pdf', '.txt', '.md'];

const chatBox   = document.getElementById('chat-box');
const input     = document.getElementById('user-input');
const sendBtn   = document.getElementById('send-btn');
const clearBtn  = document.getElementById('clear-btn');
const attachBtn = document.getElementById('attach-btn');
const fileInput = document.getElementById('file-input');
const docsBar   = document.getElementById('docs-bar');
const empty     = document.getElementById('empty');

let history = [];      // [{role, content}]
let docs = [];         // [{id, name, pages, active, uploading}]
let controller = null; // AbortController of the running request

/* ───────────── Chat rendering ───────────── */

function nearBottom() {
  return chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 80;
}
function scrollDown(force = false) {
  if (force || nearBottom()) chatBox.scrollTop = chatBox.scrollHeight;
}

function addMsg(role, text, extra = '') {
  empty.style.display = 'none';

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? 'you' : MODEL;

  const bubble = document.createElement('div');
  bubble.className = ('bubble ' + extra).trim();
  bubble.textContent = text;   // textContent, never innerHTML → no XSS from model output

  const sources = document.createElement('div');
  sources.className = 'sources';

  wrap.append(label, bubble, sources);
  chatBox.appendChild(wrap);
  scrollDown(true);
  return { wrap, bubble, sources };
}

function addError(msg) {
  empty.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'error-bubble';
  div.textContent = '⚠ ' + msg;
  chatBox.appendChild(div);
  scrollDown(true);
}

function setBusy(busy) {
  sendBtn.textContent = busy ? 'Stop ■' : 'Send ↑';
  sendBtn.classList.toggle('stop', busy);
  clearBtn.disabled = busy;
}

function autoResize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight + 2, 160) + 'px';
}

/* ───────────── Documents ───────────── */

function renderDocs() {
  docsBar.innerHTML = '';
  for (const d of docs) {
    const chip = document.createElement('div');
    chip.className = 'chip' + (d.uploading ? ' uploading' : d.active ? '' : ' inactive');
    chip.title = d.uploading ? 'Uploading…'
      : d.active ? 'Used for answers — click to exclude' : 'Excluded — click to include';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = '📄 ' + d.name;

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = d.uploading ? 'uploading…' : `${d.pages} p.`;

    chip.append(name, meta);

    if (!d.uploading) {
      const rm = document.createElement('button');
      rm.className = 'remove';
      rm.textContent = '×';
      rm.title = 'Remove document';
      rm.onclick = (e) => { e.stopPropagation(); removeDoc(d.id); };
      chip.append(rm);
      chip.onclick = () => { d.active = !d.active; renderDocs(); };
    }
    docsBar.appendChild(chip);
  }
}

async function uploadFiles(fileList) {
  for (const file of fileList) {
    const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
    if (!ALLOWED.includes(ext)) { addError(`${file.name}: unsupported type (use PDF, TXT or MD)`); continue; }
    if (file.size > MAX_UPLOAD_MB * 1024 * 1024) { addError(`${file.name}: larger than ${MAX_UPLOAD_MB} MB`); continue; }

    const placeholder = { id: 'tmp-' + Math.random(), name: file.name, uploading: true };
    docs.push(placeholder);
    renderDocs();

    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/upload', { method: 'POST', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `upload failed (${res.status})`);
      Object.assign(placeholder, data, { uploading: false, active: true });
    } catch (e) {
      docs = docs.filter(d => d !== placeholder);
      addError(`${file.name}: ${e.message}`);
    }
    renderDocs();
  }
}

async function removeDoc(id) {
  docs = docs.filter(d => d.id !== id);
  renderDocs();
  try { await fetch(`/documents/${encodeURIComponent(id)}`, { method: 'DELETE' }); } catch {}
}

async function loadDocs() {   // documents survive a page reload (until the server restarts)
  try {
    const res = await fetch('/documents');
    if (res.ok) { docs = (await res.json()).map(d => ({ ...d, active: true })); renderDocs(); }
  } catch {}
}

const activeDocIds = () => docs.filter(d => d.active && !d.uploading).map(d => d.id);

/* ───────────── Sending ───────────── */

async function sendMessage() {
  if (controller) { controller.abort(); return; }   // button acts as "Stop" while busy

  const text = input.value.trim();
  if (!text) return;
  if (docs.some(d => d.uploading)) { addError('Wait for the upload to finish.'); return; }

  input.value = '';
  autoResize();

  const userMsg = addMsg('user', text);
  history.push({ role: 'user', content: text });

  const bot = addMsg('bot', 'Thinking', 'thinking thinking-dots');
  controller = new AbortController();
  setBusy(true);

  let reply = '';
  let sources = [];
  let errorMsg = null;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, doc_ids: activeDocIds() }),
      signal: controller.signal,
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.error || `Server error (${res.status})`);
    }

    // Read the NDJSON stream line by line
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const evt = JSON.parse(line);
        if (evt.type === 'sources') sources = evt.sources;
        else if (evt.type === 'token') {
          if (!reply) bot.bubble.className = 'bubble';
          reply += evt.content;
          bot.bubble.textContent = reply;
          scrollDown();
        } else if (evt.type === 'error') errorMsg = evt.message;
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') errorMsg = e.message || 'Server/Network error';
  } finally {
    controller = null;
    setBusy(false);
  }

  if (reply) {
    history.push({ role: 'assistant', content: reply });
    if (sources.length) {
      bot.sources.textContent = 'sources: ' + sources.map(s => `${s.name} p.${s.page}`).join(' · ');
    }
    if (errorMsg) addError(errorMsg);
  } else {
    // Nothing came back: undo this turn so history stays user/assistant alternating,
    // and put the text back so the user can retry.
    bot.wrap.remove();
    userMsg.wrap.remove();
    history.pop();
    input.value = text;
    autoResize();
    if (errorMsg) addError(errorMsg);
    if (!chatBox.querySelector('.msg, .error-bubble')) empty.style.display = '';
  }
  input.focus();
}

/* ───────────── Events ───────────── */

sendBtn.onclick = sendMessage;

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener('input', autoResize);

attachBtn.onclick = () => fileInput.click();
fileInput.onchange = () => { uploadFiles([...fileInput.files]); fileInput.value = ''; };

clearBtn.onclick = () => {
  history = [];
  chatBox.innerHTML = '';
  chatBox.appendChild(empty);
  empty.style.display = '';
  input.focus();
};

// Drag & drop anywhere on the page
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if (e.dataTransfer?.types.includes('Files')) { dragDepth++; document.body.classList.add('dragging'); }
});
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) document.body.classList.remove('dragging');
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  if (e.dataTransfer?.files.length) uploadFiles([...e.dataTransfer.files]);
});

window.onload = () => { loadDocs(); input.focus(); };
</script>

</body>
</html>
